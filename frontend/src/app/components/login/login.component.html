<div class="min-h-screen flex items-center justify-center p-4 login-fondo">
  <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 overflow-hidden rounded-2xl shadow-2xl">

    <!-- Panel izquierdo: identidad -->
    <div class="login-panel-izq p-10 flex flex-col items-center justify-center text-center">
      <div class="login-logo-badge mb-6">
        <img src="assets/logo.png" alt="Molinos del Atlántico" class="h-20 w-auto">
      </div>
      <h1 class="login-titulo">MOLINOS DEL ATLÁNTICO S.A.S.</h1>
      <p class="text-sm text-white/80 mt-2">Formatos Digitales de Producción</p>
      <div class="mt-3 text-xs font-mono font-bold text-white/60 uppercase tracking-widest">La Nieve</div>
    </div>

    <!-- Panel derecho: formulario -->
    <div class="bg-white p-8 sm:p-10 flex flex-col justify-center">
      <h2 class="text-xl font-black text-gray-800">Iniciar sesión</h2>
      <p class="text-sm text-gray-500 mt-1 mb-6">Introduce tus credenciales de acceso</p>

      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-mono font-bold text-gray-600 uppercase tracking-wide mb-1">Usuario</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/>
              <path d="M4 20c0-3.5 3.5-6 8-6s8 2.5 8 6"/>
            </svg>
            <input type="text" [(ngModel)]="username" (keyup.enter)="login()"
              placeholder="Tu nombre de usuario"
              class="login-input">
          </div>
        </div>

        <div>
          <label class="block text-xs font-mono font-bold text-gray-600 uppercase tracking-wide mb-1">Contraseña</label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="11" width="14" height="9" rx="1.5"/>
              <path d="M8 11V7a4 4 0 1 1 8 0v4"/>
            </svg>
            <input [type]="mostrarPassword ? 'text' : 'password'"
              [(ngModel)]="password" (keyup.enter)="login()"
              placeholder="Tu contraseña"
              class="login-input pr-10">
            <button type="button" (click)="mostrarPassword = !mostrarPassword"
              class="login-toggle-ojo" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 3l18 18"/>
                <path d="M10.6 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3.9-.8"/>
                <path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error -->
        <div *ngIf="error" class="bg-red-50 border border-red-200 text-brand-red text-xs font-bold px-4 py-3 rounded-lg text-center">
          {{ error }}
        </div>

        <!-- Botón -->
        <button (click)="login()" [disabled]="cargando"
          class="w-full bg-brand-blue hover:bg-brand-blue-dark disabled:opacity-50 text-white font-bold py-3 rounded-lg text-sm transition-colors mt-2">
          {{ cargando ? 'Ingresando...' : 'Entrar' }}
        </button>
      </div>

      <p class="text-center text-[11px] text-gray-400 mt-6">
        Si tienes problemas para entrar, contacta al administrador del sistema.
      </p>
    </div>
  </div>
</div>
